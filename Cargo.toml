[package]
name = "iup"
version = "0.0.4"
edition = "2015"
rust-version = "1.82"
description = "IUP is a multi-platform toolkit for building graphical user interfaces."
documentation = "https://docs.rs/iup/"
readme = "README.md"
repository = "https://github.com/dcampbell24/iup-rust"
license = "MIT"
keywords = ["IUP"]
categories = ["gui"]
include = ["src/**/*", "LICENSE", "README.md"]
authors = ["David Campbell <dcampbell24@gmail.com>",
           "Denilson das Mercês Amorim <dma_2012@hotmail.com>"]

[lib]
name = "iup"

[dependencies]
iup-sys = "0.0"
libc = "0.1"
